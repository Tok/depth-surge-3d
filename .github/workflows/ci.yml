name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dev tools
        run: uv sync --locked --only-dev

      - name: Check formatting with black
        run: uv run --no-sync black --check src/ tests/ depth_surge_3d.py

      - name: Lint with flake8
        run: uv run --no-sync flake8 src/ tests/ depth_surge_3d.py --count --show-source --statistics

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free disk space for CUDA wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run type checking (mypy)
        run: uv run --no-sync mypy src/depth_surge_3d --ignore-missing-imports

      - name: Run unit tests
        run: >
          uv run --no-sync pytest tests/unit -v
          --cov=src/depth_surge_3d --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Run integration tests
        run: uv run --no-sync pytest tests/integration -v -m integration

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Audit locked dependencies
        continue-on-error: true
        run: |
          uv export --locked --no-hashes --no-emit-project \
            --no-emit-package depth-anything-3 --format requirements-txt > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps
